
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
$terminal = ghostty
$browser = zen-browser
$fileManager = nemo

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, e, exec, $fileManager
bind = $mainMod, Escape, exec, hyprlock
bind = $mainMod, q, killactive, 
bind = $mainMod SHIFT, W, exec, bash ~/.config/hypr/waybar.sh
bind = $mainMod, E, exec, dolphin
bind = $mainMod, Space, togglefloating, 
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, t, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = SUPER, G, togglegroup
bind = SUPER, TAB, changegroupactive, f
bind = SUPER_SHIFT, TAB, changegroupactive, b

# bind = $mainMod SHIFT,L, layoutmsg orientation r
# bind = $mainMod SHIFT,H, layoutmsg orientation l
#
# bind = $mainMod SHIFT,K, layoutmsg orientation u
bind = $mainMod, N, layoutmsg, orienttop
# bind = $mainMod SHIFT,J, layoutmsg orientation d

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# rofi launcher
bindr = $mainMod, d, exec, rofi -show drun -show-icons

# Volume
bind =,code:121, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind =,code:122, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bind =,code:123, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+

# Mic
bind =,code:198, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bind =,code:232,exec,brightnessctl set 10%-
bind =,code:233,exec,brightnessctl set +10%

# screenshot
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | convert - -shave 1x1 PNG:- | wl-copy


# Example special workspace (scratchpad)
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

bind = CTRL $mainMod SHIFT, h, movecurrentworkspacetomonitor, l
bind = CTRL $mainMod SHIFT, l, movecurrentworkspacetomonitor, r
bind = CTRL $mainMod SHIFT, k, movecurrentworkspacetomonitor, u
bind = CTRL $mainMod SHIFT, j, movecurrentworkspacetomonitor, d

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, s, exec, $HOME/.dotfiles/tmux-sessionizer 
bind = $mainMod, v, exec, $HOME/.dotfiles/scripts/vpn-startup
bind = $mainMod, b, exec, $HOME/.dotfiles/scripts/bluetooth
bind = $mainMod, c, exec, $HOME/.dotfiles/scripts/layout-switch

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, f11, exec, $HOME/.dotfiles/.config/hypr/scripts/rec
