# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=eDP-1,highres,auto-down,1.25
# monitor=HDMI-A-1,highres,auto-up,1
monitor=eDP-1,highres,auto-left,1.25
monitor=HDMI-A-1,highres,auto-center-right,1

# DP-1 Fix: Explicitly set resolution + rotation
# Dell U2412M native resolution: 1920x1200@60Hz
# Transform: 1 = 90° clockwise (left side on bottom)
monitor=DP-1,1920x1200@60,auto-right,1,transform,1


# exec-once = [workspace 2 silent] $browser
# exec-once = [workspace 3 silent] slack
# exec-once = [workspace 4 silent] datagrip
# exec-once = [workspace 4 silent] postman

exec-once = handle_monitor_connect.sh
exec-once = ~/.config/hypr/init-dp1.sh

# windowrule = float,  title:^(GAMEDEV)
# windowrule = center, title:^(GAMEDEV)
windowrule {
    name = gamedev-windows-floating
    match:title = ^GAMEDEV

    float = on
}

windowrule {
    name = youtube-windows-floating
    match:title = *youtube*

    float = on
}
