cursor {
    no_hardware_cursors = true
} 

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gaps_in = 4
    gaps_out = 4
    border_size = 3
    col.active_border = rgba(aca1cfff) rgba(E29ECAFF) 90deg
    col.inactive_border = rgba(2a2a2fff) rgba(3a3a3f33) 90deg

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 1
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    # drop_shadow = yes
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

$animSpeed = 1
animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.215, 0.61, 0.355, 1

    
    animation = windows, 1, $animSpeed, myBezier
    animation = windowsOut, 1, $animSpeed, default, popin 80%
    animation = border, 1, 8, myBezier
    animation = borderangle, 1, 30, myBezier
    animation = fade, 1, 4, default
    animation = workspaces, 1, $animSpeed, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = true
}

scrolling {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    column_width = .9
    focus_fit_method = 0
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # workspace_swipe = on  # DEPRECATED - replaced with gesture syntax below

    # Three-finger horizontal swipe to switch workspaces
    gesture = 3, horizontal, workspace
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 to disable the anime mascot wallpapers
}

